name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate skill metadata and helper syntax
        run: |
          python scripts/validate_repo.py
          python -m py_compile runpod/scripts/runpod_docs.py
      - name: Validate Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail README.md runpod/**/*.md
          fail: true
